name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Copy ban (no em/en dashes in user-visible source)
        run: |
          EN=$(printf '\342\200\223'); EM=$(printf '\342\200\224')
          if grep -rl -e "$EN" -e "$EM" app components lib inngest; then
            echo "::error::en/em dashes found in user-visible source (hard ban, see AGENTS.md)"
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # NOTE: Playwright smoke is gated on a separate job that will land
      # when P0 finishes wiring `e2e/`. Tracked in
      # docs/product/build-checklist.md (T2 vitest+playwright item).
